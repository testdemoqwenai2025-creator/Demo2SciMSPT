<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<!-- Resource Hints -->
<link rel="dns-prefetch" href="//fonts.googleapis.com">
<link rel="dns-prefetch" href="//fonts.gstatic.com">
<link rel="dns-prefetch" href="//www.googletagmanager.com">
<meta name="theme-color" content="#00E5FF">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - SciMSPT</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #030810;
      color: #e8f4fc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .offline-container {
      text-align: center;
      max-width: 480px;
    }
    .offline-icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 32px;
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(0,229,255,0.2), rgba(167,139,250,0.2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #00E5FF, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      background: linear-gradient(135deg, #00E5FF, #4da8da);
      color: #030810;
      font-weight: 600;
      font-size: 16px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .retry-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0,229,255,0.3);
    }
    .cached-pages {
      margin-top: 48px;
      padding-top: 32px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .cached-pages h3 {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .page-links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .page-links a {
      padding: 8px 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(0,229,255,0.2);
      border-radius: 8px;
      color: #00E5FF;
      text-decoration: none;
      font-size: 13px;
      transition: all 0.2s;
    }
    .page-links a:hover {
      background: rgba(0,229,255,0.1);
      border-color: #00E5FF;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">📡</div>
    <h1>You're Offline</h1>
    <p>No worries! Some features may still work with cached data. Check your connection and try again.</p>
    <button class="retry-btn" onclick="window.location.reload()">
      🔄 Retry Connection
    </button>
    
    <div class="cached-pages">
      <h3>Cached Pages (Available Offline)</h3>
      <div class="page-links">
        <a href="https://testdemoqwenai2025-creator.github.io/Demo2SciMSPT/index.html">Home</a>
        <a href="/platform.html">Platform</a>
        <a href="/quantum.html">Quantum</a>
        <a href="/pipeline.html">Pipeline</a>
        <a href="/security.html">Security</a>
        <a href="/dashboard.html">Dashboard</a>
      </div>
    </div>
  </div>

  <script>
    // Auto-retry when back online
    window.addEventListener('online', () => {
      window.location.reload();
    });
    
    // Show online status changes
    window.addEventListener('online', () => {
      document.querySelector('.offline-icon').textContent = '🟢';
      document.querySelector('h1').textContent = "You're Back Online!";
      document.querySelector('p').textContent = 'Redirecting to fresh content...';
    });
    
    window.addEventListener('offline', () => {
      document.querySelector('.offline-icon').textContent = '📡';
      document.querySelector('h1').textContent = "You're Offline";
    });
  </script>
<!-- Service Worker Registration -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => console.log('✅ SW registered:', reg.scope))
      .catch(err => console.warn('⚠️ SW registration failed:', err));
  });
}
</script>
<!-- Performance Optimizer -->
<script src="js/performance.js" defer></script>
</body>
</html>
