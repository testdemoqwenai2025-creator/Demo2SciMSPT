<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SciMSPT — Beyond the Scaling Wall | Investor Foresight Deck</title>
  <meta name="description" content="12 Frontier Computing Projects That Will Reshape AI Infrastructure, 2025–2045. SciMSPT Research-to-Investor Presentation.">
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  
  <style>
    /* ── CSS Variables & Theme System ─────────────────────────────── */
    :root {
      --bg-dark: #0a1628;
      --bg-light: #f5f8fc;
      --bg-card-dark: rgba(20, 40, 64, 0.7);
      --bg-card-light: rgba(255, 255, 255, 0.95);
      --primary-dark: #e8f0f8;
      --primary-light: #142840;
      --accent: #4da8da;
      --accent-glow: #2d7ab3;
      --muted-dark: #7a9bb8;
      --muted-light: #5a7a96;
      --border-dark: rgba(77, 168, 218, 0.25);
      --border-light: #c0d0e2;
      --surface-dark: rgba(45, 122, 179, 0.08);
      --surface-light: #edf2f9;
      
      --font-heading: 'Playfair Display', Georgia, serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-num: 'JetBrains Mono', 'Inter', monospace;
      
      --nav-height: 64px;
      --controls-height: 72px;
    }
    
    [data-theme="dark"] {
      --bg: var(--bg-dark);
      --bg-card: var(--bg-card-dark);
      --primary: var(--primary-dark);
      --muted: var(--muted-dark);
      --border: var(--border-dark);
      --surface: var(--surface-dark);
      --shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
      --nav-bg: rgba(10, 22, 40, 0.92);
      --controls-bg: rgba(10, 22, 40, 0.95);
    }
    
    [data-theme="light"] {
      --bg: var(--bg-light);
      --bg-card: var(--bg-card-light);
      --primary: var(--primary-light);
      --muted: var(--muted-light);
      --border: var(--border-light);
      --surface: var(--surface-light);
      --shadow: 0 12px 48px rgba(20, 40, 64, 0.12);
      --nav-bg: rgba(245, 248, 252, 0.95);
      --controls-bg: rgba(245, 248, 252, 0.98);
    }
    
    /* ── Reset & Base ────────────────────────────────────────────── */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html {
      scroll-behavior: smooth;
      overflow: hidden;
      height: 100%;
    }
    
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--primary);
      height: 100%;
      overflow: hidden;
      transition: background 0.4s ease, color 0.4s ease;
      -webkit-font-smoothing: antialiased;
    }
    
    /* ── Navigation Bar ──────────────────────────────────────────── */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--nav-height);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      background: var(--nav-bg);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      transition: all 0.3s ease;
    }
    
    .nav-left {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--primary);
      transition: opacity 0.3s ease;
    }
    
    .nav-logo:hover { opacity: 0.85; }
    
    .nav-logo img {
      width: 28px;
      height: 28px;
      filter: drop-shadow(0 0 6px var(--accent));
    }
    
    .nav-logo-text {
      font-family: var(--font-heading);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    
    .nav-logo-text span { color: var(--accent); }
    
    .deck-title {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
      letter-spacing: 0.5px;
      max-width: 280px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .nav-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    
    .slide-counter {
      font-family: var(--font-num);
      font-size: 13px;
      color: var(--muted);
      background: var(--surface);
      padding: 6px 14px;
      border-radius: 16px;
      border: 1px solid var(--border);
      letter-spacing: 1px;
      min-width: 70px;
      text-align: center;
    }
    
    .slide-counter .current {
      color: var(--accent);
      font-weight: 600;
      font-size: 15px;
    }
    
    .theme-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      transition: all 0.3s ease;
      white-space: nowrap;
    }
    
    .theme-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    
    .theme-toggle .material-icons {
      font-size: 16px;
    }
    
    /* ── Slide Container ─────────────────────────────────────────── */
    .slide-container {
      position: fixed;
      top: var(--nav-height);
      left: 0;
      right: 0;
      bottom: var(--controls-height);
      overflow: hidden;
      background: #1a1a1a;
    }
    
    .slide-frame-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
    }
    
    .slide-frame-wrapper iframe {
      width: 1280px;
      max-width: 100%;
      height: 100%;
      max-height: 720px;
      border: none;
      border-radius: 4px;
      box-shadow: var(--shadow);
      background: white;
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.35s ease;
    }
    
    @media (max-width: 1340px) {
      .slide-frame-wrapper iframe {
        width: 100%;
        height: 100%;
        max-height: none;
        border-radius: 0;
        box-shadow: none;
      }
    }
    
    /* Slide transitions */
    .slide-entering {
      animation: slideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    
    .slide-leaving {
      animation: slideOut 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(30px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }
    
    @keyframes slideOut {
      from {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
      to {
        opacity: 0;
        transform: translateX(-30px) scale(0.98);
      }
    }
    
    /* ── Controls Bar ────────────────────────────────────────────── */
    .controls-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--controls-height);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      background: var(--controls-bg);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      transition: all 0.3s ease;
    }
    
    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.25s ease;
    }
    
    .nav-btn:hover:not(:disabled) {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
      transform: scale(1.05);
      box-shadow: 0 4px 16px rgba(77, 168, 218, 0.35);
    }
    
    .nav-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    
    .nav-btn .material-icons {
      font-size: 22px;
    }
    
    /* Dot indicators */
    .dots-container {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      justify-content: center;
      overflow-x: auto;
      padding: 0 16px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    
    .dots-container::-webkit-scrollbar { display: none; }
    
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--border);
      cursor: pointer;
      transition: all 0.3s ease;
      flex-shrink: 0;
      position: relative;
    }
    
    .dot:hover {
      background: var(--accent-glow);
      transform: scale(1.2);
    }
    
    .dot.active {
      background: var(--accent);
      transform: scale(1.25);
      box-shadow: 0 0 10px rgba(77, 168, 218, 0.5);
    }
    
    .dot::after {
      content: attr(data-label);
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-num);
      font-size: 9px;
      color: var(--muted);
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
      padding: 4px 8px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
    }
    
    .dot:hover::after,
    .dot.active::after {
      opacity: 1;
    }
    
    /* Quick nav links */
    .quick-links {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .quick-link {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      transition: all 0.25s ease;
      white-space: nowrap;
      letter-spacing: 0.3px;
    }
    
    .quick-link:hover {
      color: var(--accent);
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    
    /* ── Keyboard hint ───────────────────────────────────────────── */
    .keyboard-hint {
      position: fixed;
      bottom: calc(var(--controls-height) + 12px);
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: var(--muted);
      background: var(--bg-card);
      padding: 6px 16px;
      border-radius: 16px;
      border: 1px solid var(--border);
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
      z-index: 999;
      font-family: var(--font-num);
      letter-spacing: 0.5px;
    }
    
    .keyboard-hint.visible {
      opacity: 1;
    }
    
    .keyboard-hint kbd {
      display: inline-block;
      padding: 2px 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      margin: 0 2px;
      font-family: inherit;
      font-size: 10px;
    }
    
    /* ── Loading State ───────────────────────────────────────────── */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      transition: opacity 0.5s ease;
    }
    
    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    .loader {
      width: 48px;
      height: 48px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .loading-text {
      margin-top: 20px;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    
    /* ── Responsive Design ───────────────────────────────────────── */
    @media (max-width: 768px) {
      .navbar {
        padding: 0 16px;
        height: 56px;
      }
      
      .nav-top { --nav-height: 56px; }
      
      .deck-title { display: none; }
      
      .nav-logo-text { font-size: 15px; }
      
      .slide-counter {
        font-size: 11px;
        padding: 4px 10px;
        min-width: 60px;
      }
      
      .theme-toggle {
        padding: 6px 10px;
        font-size: 10px;
      }
      
      .theme-toggle span { display: none; }
      
      .controls-bar {
        padding: 0 16px;
        height: 60px;
      }
      
      .nav-btn {
        width: 38px;
        height: 38px;
      }
      
      .quick-links { display: none; }
      
      .dot { width: 8px; height: 8px; }
      
      .slide-frame-wrapper { padding: 8px; }
      
      .keyboard-hint { 
        font-size: 10px; 
        bottom: calc(60px + 8px); 
        padding: 4px 12px;
      }
    }
    
    @media (max-width: 480px) {
      .dots-container { gap: 6px; }
      .dot { width: 7px; height: 7px; }
      .slide-counter { min-width: 54px; }
    }
    
    /* ── Print Styles ────────────────────────────────────────────── */
    @media print {
      .navbar, .controls-bar, .keyboard-hint { display: none !important; }
      .slide-container {
        top: 0;
        bottom: 0;
        position: absolute;
      }
    }
  </style>
</head>
<body>

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loader"></div>
    <div class="loading-text">Loading Investor Deck...</div>
  </div>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-left">
      <a href="#" class="nav-logo" onclick="goToSlide(0); return false;">
        <img src="assets/icons/icon-science.png" alt="SciMSPT">
        <span class="nav-logo-text">Sci<span>MSPT</span></span>
      </a>
      <span class="deck-title">Beyond the Scaling Wall — Investor Foresight Deck</span>
    </div>
    
    <div class="nav-right">
      <div class="slide-counter">
        <span class="current" id="currentSlide">1</span> / <span id="totalSlides">15</span>
      </div>
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark/light theme">
        <i class="material-icons" id="themeIcon">dark_mode</i>
        <span id="themeText">Dark</span>
      </button>
    </div>
  </nav>

  <!-- Slide Display Area -->
  <main class="slide-container">
    <div class="slide-frame-wrapper">
      <iframe id="slideFrame" src="assets/slides/slide_01.html" title="Investor Deck Slide"></iframe>
    </div>
  </main>

  <!-- Controls Bar -->
  <footer class="controls-bar">
    <button class="nav-btn" id="prevBtn" onclick="prevSlide()" aria-label="Previous slide">
      <i class="material-icons">chevron_left</i>
    </button>
    
    <div class="dots-container" id="dotsContainer">
      <!-- Dots generated by JS -->
    </div>
    
    <div class="quick-links">
      <a href="#portfolio" class="quick-link" onclick="window.open('portfolio-shorts/P3.html', '_blank'); return false;">Portfolio</a>
      <a href="#reports" class="quick-link" onclick="window.open('assets/reports/SciMSPT_Foresight_Series_Bundle.pdf', '_blank'); return false;">Reports</a>
    </div>
    
    <button class="nav-btn" id="nextBtn" onclick="nextSlide()" aria-label="Next slide">
      <i class="material-icons">chevron_right</i>
    </button>
  </footer>

  <!-- Keyboard Hint -->
  <div class="keyboard-hint" id="keyboardHint">
    Use <kbd>←</kbd> <kbd>→</kbd> keys to navigate · <kbd>Home</kbd> <kbd>End</kbd> for first/last
  </div>

  <script>
    // ── Configuration ─────────────────────────────────────────────
    const SLIDES = [
      { file: 'slide_01.html', label: 'Cover' },
      { file: 'slide_02.html', label: 'Scaling Wall' },
      { file: 'slide_03.html', label: 'Domains' },
      { file: 'slide_04.html', label: 'Quantum' },
      { file: 'slide_05.html', label: 'Neuromorphic' },
      { file: 'slide_06.html', label: 'Beyond-CMOS' },
      { file: 'slide_07.html', label: 'Photonic' },
      { file: 'slide_08.html', label: 'Data Infra' },
      { file: 'slide_09.html', label: 'AI Discovery' },
      { file: 'slide_10.html', label: 'Portfolio' },
      { file: 'slide_11.html', label: 'Metrics' },
      { file: 'slide_12.html', label: 'Financials' },
      { file: 'slide_13.html', label: 'Risk Matrix' },
      { file: 'slide_14.html', label: 'Timeline' },
      { file: 'slide_15.html', label: 'Contact' }
    ];
    
    const SLIDES_BASE = 'assets/slides/';
    let currentSlide = 0;
    let isLoading = false;
    
    // ── DOM Elements ──────────────────────────────────────────────
    const frame = document.getElementById('slideFrame');
    const currentEl = document.getElementById('currentSlide');
    const totalEl = document.getElementById('totalSlides');
    const dotsContainer = document.getElementById('dotsContainer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const keyboardHint = document.getElementById('keyboardHint');
    
    // ── Initialize ────────────────────────────────────────────────
    function init() {
      totalEl.textContent = SLIDES.length;
      generateDots();
      updateUI();
      
      // Show keyboard hint briefly after load
      setTimeout(() => {
        keyboardHint.classList.add('visible');
        setTimeout(() => keyboardHint.classList.remove('visible'), 4000);
      }, 2000);
      
      // Hide loading overlay when first slide loads
      frame.addEventListener('load', () => {
        loadingOverlay.classList.add('hidden');
      });
      
      // Fallback: hide loader after timeout
      setTimeout(() => {
        loadingOverlay.classList.add('hidden');
      }, 1500);
      
      // Restore saved position
      const savedSlide = parseInt(localStorage.getItem('scimspt-slide') || '0', 10);
      if (savedSlide >= 0 && savedSlide < SLIDES.length && savedSlide !== 0) {
        goToSlide(savedSlide, false);
      }
    }
    
    // ── Generate Dot Indicators ──────────────────────────────────
    function generateDots() {
      dotsContainer.innerHTML = '';
      SLIDES.forEach((slide, index) => {
        const dot = document.createElement('button');
        dot.className = `dot${index === 0 ? ' active' : ''}`;
        dot.setAttribute('data-label', `${index + 1}: ${slide.label}`);
        dot.setAttribute('aria-label', `Go to slide ${index + 1}: ${slide.label}`);
        dot.onclick = () => goToSlide(index);
        dotsContainer.appendChild(dot);
      });
    }
    
    // ── Update UI State ───────────────────────────────────────────
    function updateUI() {
      // Counter
      currentEl.textContent = currentSlide + 1;
      
      // Buttons
      prevBtn.disabled = currentSlide === 0;
      nextBtn.disabled = currentSlide === SLIDES.length - 1;
      
      // Dots
      const dots = dotsContainer.querySelectorAll('.dot');
      dots.forEach((dot, index) => {
        dot.classList.toggle('active', index === currentSlide);
      });
      
      // Save position
      localStorage.setItem('scimspt-slide', currentSlide.toString());
    }
    
    // ── Navigate to Specific Slide ────────────────────────────────
    function goToSlide(index, animate = true) {
      if (index < 0 || index >= SLIDES.length || index === currentSlide || isLoading) return;
      
      const oldIndex = currentSlide;
      currentSlide = index;
      
      if (animate) {
        isLoading = true;
        frame.classList.add('slide-leaving');
        
        setTimeout(() => {
          frame.src = SLIDES_BASE + SLIDES[currentSlide].file;
          frame.classList.remove('slide-leaving');
          frame.classList.add('slide-entering');
          
          setTimeout(() => {
            frame.classList.remove('slide-entering');
            isLoading = false;
          }, 400);
        }, 280);
      } else {
        frame.src = SLIDES_BASE + SLIDES[currentSlide].file;
      }
      
      updateUI();
      
      // Scroll active dot into view
      const activeDot = dotsContainer.children[currentSlide];
      if (activeDot) {
        activeDot.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      }
    }
    
    // ── Navigation Functions ──────────────────────────────────────
    function nextSlide() {
      goToSlide(currentSlide + 1);
    }
    
    function prevSlide() {
      goToSlide(currentSlide - 1);
    }
    
    // ── Theme Toggle ──────────────────────────────────────────────
    function toggleTheme() {
      const html = document.documentElement;
      const newTheme = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', newTheme);
      localStorage.setItem('scimspt-theme', newTheme);
      
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      
      if (newTheme === 'light') {
        icon.textContent = 'light_mode';
        text.textContent = 'Light';
      } else {
        icon.textContent = 'dark_mode';
        text.textContent = 'Dark';
      }
      
      // Notify iframe about theme change
      try {
        frame.contentWindow.postMessage({ type: 'theme-change', theme: newTheme }, '*');
      } catch (e) {
        // Cross-origin may prevent this
      }
    }
    
    // ── Restore Theme on Load ─────────────────────────────────────
    function restoreTheme() {
      const savedTheme = localStorage.getItem('scimspt-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      
      if (savedTheme === 'light') {
        icon.textContent = 'light_mode';
        text.textContent = 'Light';
      }
    }
    
    // ── Keyboard Navigation ───────────────────────────────────────
    document.addEventListener('keydown', (e) => {
      // Don't capture if user is typing in an input
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      
      switch(e.key) {
        case 'ArrowRight':
        case ' ':
        case 'PageDown':
          e.preventDefault();
          nextSlide();
          break;
        case 'ArrowLeft':
        case 'PageUp':
          e.preventDefault();
          prevSlide();
          break;
        case 'Home':
          e.preventDefault();
          goToSlide(0);
          break;
        case 'End':
          e.preventDefault();
          goToSlide(SLIDES.length - 1);
          break:
        case 'f':
        case 'F':
          if (!e.ctrlKey && !e.metaKey) {
            e.preventDefault();
            toggleFullscreen();
          }
          break;
        case '?':
          e.preventDefault();
          keyboardHint.classList.toggle('visible');
          setTimeout(() => keyboardHint.classList.remove('visible'), 3000);
          break;
      }
    });
    
    // ── Fullscreen Toggle ─────────────────────────────────────────
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.log('Fullscreen not available:', err);
        });
      } else {
        document.exitFullscreen();
      }
    }
    
    // ── Touch/Swipe Support ───────────────────────────────────────
    let touchStartX = 0;
    let touchEndX = 0;
    
    document.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });
    
    document.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, { passive: true });
    
    function handleSwipe() {
      const diff = touchStartX - touchEndX;
      const threshold = 80;
      
      if (Math.abs(diff) > threshold) {
        if (diff > 0) {
          nextSlide(); // Swipe left = next
        } else {
          prevSlide(); // Swipe right = prev
        }
      }
    }
    
    // ── Initialize on Load ───────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
      restoreTheme();
      init();
    });
  </script>
</body>
</html>
